<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sekrety Spokojnego Snu</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
  <div class="fog fog-1"></div>
  <div class="fog fog-2"></div>

  <div class="container">
    <header class="hero">
      <h1 data-aos="fade-down">Sekrety Spokojnego Snu</h1>
      <p data-aos="fade-up" data-aos-delay="200">Jak zasnąć w 5 minut — nawet po stresującym dniu</p>
    </header>

    <main class="content">
      <div class="tablet-wrapper" data-aos="zoom-in" data-aos-delay="400">
        <div class="tablet-glass">
          <img src="okladka.png" alt="Okładka e-booka" class="ebook-cover" onerror="this.style.display='none'; this.parentElement.innerHTML+='<div class=\"fallback\">Obrazek nie załadował się</div>';" />
        </div>
      </div>

      <div class="info-box" data-aos="fade-up" data-aos-delay="600">
        <h2>Odkryj techniki, które działają</h2>
        <p>Od oddychania 4-7-8, przez medytację do naturalnych ziół — wszystko w jednym przewodniku.</p>
        <button class="cta-btn">Pobierz e-book za darmo</button>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2025 | Sekrety Spokojnego Snu</p>
    </footer>
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="script.js"></script>
</body>
</html>
