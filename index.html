<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sekrety Spokojnego Snu</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Nagłówek -->

      <h1>Sekrety Spokojnego Snu</h1>

    <!-- Główna animacja: Tablet z e-bookiem -->
    <main class="main-content">
      <div class="tablet-container">
        <div class="tablet">
          <img src="okladka.png" alt="E-book: Sekrety Spokojnego Snu" class="ebook-cover" />
        </div>
        <div class="glow"></div>
      </div>

      <!-- Opis -->
      <div class="description">
        <h2>Odkryj sekrety zdrowego snu</h2>
        <p>W tym e-booku znajdziesz praktyczne metody, które pomogą Ci zasnąć szybciej, lepiej i bez stresu. Idealne dla osób, które walczą z bezsennością.</p>
        <button class="cta-button">Pobierz teraz za darmo</button>
      </div>
    </main>

    <!-- Stopka -->
    <footer class="footer">
      <p>&copy; 2025 Sekrety Spokojnego Snu | Wszelkie prawa zastrzeżone</p>
    </footer>
  </div>

  <script src="script.js"></script>
